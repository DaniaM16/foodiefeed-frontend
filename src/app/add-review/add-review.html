<h1>Neuen Foodie adden</h1>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

    
    <h2 class="mb-4"> Review hinzufügen</h2>

<form [formGroup]="form">
<div class="mb-3"> 
    <label for="name" class="form-label"> Name</label>
    <input 
    class="form-control"
    type="text" 
    id="name" 
    formControlName="nameControl">
</div>

<div class="mb-3">  
    <label for="category" class="form-label">Kategorie</label>
    <select
    id="category" 
    type="text"
    class="form-control"
    formControlName="categoryControl">

    <option value="">Kategorie auswählen</option>
    <option value="Café">Café</option>
    <option value="Restaurant">Restaurant</option>
    <option value="Bar">Bar</option>
    <option value="Imbiss">Imbiss</option>
    <option value="Lernspot">Lernspot</option>
    <option value="Bäckerei">Bäckerei</option>
    <option value="Sonstiges">Sonstiges</option>
</select>
</div>


    <div> class="mb-3">
        <label for="district" class="form-label">Stadtteil</label>
   <select
   id="district"
   class="form-control"
   formControlName="districtControl">

   <option value="">Stadtteil auswählen</option>
   <option value="Mitte">Mitte</option>
   <option value="Friedrichshain">Friedrichshain</option>
   <option value="Kreuzberg">Kreuzberg</option>
   <option value="Prenzlauer Berg">Prenzlauer Berg</option>
   <option value="Neukölln">Neukölln</option>
   <option value="Charlottenburg">Charlottenburg</option>
   <option value="Schöneberg">Schöneberg</option>
<option value="Köpenick">Köpenick</option>
<option value="Sonstiges">Sonstiges</option>
</select>
    </div>

  
    <div> class="mb-3">
        <label for="rating" class="form-label">Bewertung</label>
   <select

   id="rating"
   class="form-select"
   formControlName="ratingControl">
   <option value="1"> ⭐️ </option>
    <option value="2"> ⭐️⭐️ </option>
    <option value="3"> ⭐️⭐️⭐️ </option>
    <option value="4"> ⭐️⭐️⭐️⭐️ </option>
    <option value="5"> ⭐️⭐️⭐️⭐️⭐️ </option>
</select>
    </div>


<div> class="mb-3">
        <label for="comment" class="form-label">Kommentar</label>
   <textarea 
   rows="4"
   id="comment"
   class="form-control"
   formControlName="commentControl">
   </textarea>
    </div>

<div> class="mb-3">
        <label for="date" class="form-label">Besuchsdatum</label>
   <input 
   type="date"
   id="date"
   class="form-control"
   formControlName="dateControl">
    </div>


<div> class="form-check mb-4">
<input
 type="checkbox"
   id="recommend"
   class="form-check-input"
   formControlName="recommendControl">

   <label for="recommend" class="form-check-label">
   Approved für Wiederholung
 </label>
    </div>

    <button type="submit" class="btn btn-dark">
        Review speichern
    </button>
</form>
 </div>
 
</div>
    </div>
