<h1>Neuen Foodie adden</h1>

<form>
    <label for="name"> Name</label>
    <input type="text" id="name" name="name">

    <label for="category">Kategorie</label>
    <select id="category" name="category">
<option value="cafe">Café</option>
<option value="restaurant">Restaurant</option>
<option value="bar">Bar</option>
<option value="studyplace">Studyplace</option>
<option value="fastfoodie">Fast Foodie</option>
<option value="sonstiges">Sonstiges</option>
    </select>

<label for="district">Stadtteil</label>
<input type="text" id="district" name="district">

<label for="rating">Rating</label>
<select name="rating" id="rating">
<option value="1">1 Stern</option>
<option value="2">2 Stern</option>
<option value="3">3 Stern</option>
<option value="4">4 Stern</option>
<option value="5">5 Stern</option>
</select>

<label for="comment">Kommentar</label>
<textarea name="comment" id="comment"></textarea>

<label for="date">Besuchsdatum</label>
<input type="date" id="date" name="date">

<label for="recommend">
    <input type="checkbox" id="recommend" name="recommend">
    Approved für Wiederholung  
</label>

    <button type="submit">Speichern</button>
</form>
